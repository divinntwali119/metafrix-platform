<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111315" />
    <title>Hors connexion — MetafriX</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111315;
        color: #f6f7f9;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 440px);
        padding: 36px;
        border: 1px solid #2d3137;
        border-radius: 20px;
        background: #1d2127;
        text-align: center;
        box-sizing: border-box;
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #e94f16;
        color: #111315;
        font-size: 40px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 24px;
        color: #a6acb5;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        background: #8976f2;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>Vous êtes hors connexion</h1>
      <p>MetafriX a besoin d’une connexion internet pour charger cette page. Réessayez lorsque vous serez reconnecté.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
