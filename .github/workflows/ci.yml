name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afrihub
          POSTGRES_USER: afrihub
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrihub -d afrihub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklm
      DJANGO_ALLOWED_HOSTS: localhost,testserver,example.com
      DATABASE_URL: postgresql://afrihub:ci-only-password@127.0.0.1:5432/afrihub
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py check

      - name: Check migrations
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test -v 1

      - name: Check production security settings
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          # Synthetic CI-only domain; these are not deployment defaults.
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy

  quality:
    name: Lint and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
